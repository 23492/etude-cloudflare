name: build-test-deploy

# Push / manual run: test and deploy the Etude version pinned in etude.ref.
# Daily schedule: if Etude published a newer release, test it against the sync worker.
#   green -> bump etude.ref and deploy;  red -> keep the current version and open an issue.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Etude tag or commit to test (empty = etude.ref)"
        required: false
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: etude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      pinned: ${{ steps.r.outputs.pinned }}
      changed: ${{ steps.r.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          pinned=$(tr -d ' \n' < etude.ref)
          ref="$pinned"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=$(gh api repos/Zibhelina/etude/releases/latest --jq .tag_name)
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$ref" != "$pinned" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned candidate=$ref"

  test:
    needs: resolve
    if: github.event_name != 'schedule' || needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ETUDE_REF: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Fetch Etude
        run: |
          git clone https://github.com/Zibhelina/etude.git etude
          git -C etude checkout "$ETUDE_REF"
      - name: Worker deps
        working-directory: sync-worker
        run: npm install --no-audit --no-fund -D wrangler@4
      - name: Start worker locally (wrangler dev, local D1)
        working-directory: sync-worker
        run: |
          npx wrangler d1 execute etude-sync-local --local --config wrangler.local.jsonc --file schema.sql
          nohup npx wrangler dev --config wrangler.local.jsonc --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health
      - name: Protocol smoke test
        working-directory: sync-worker
        run: node test/smoke.mjs http://127.0.0.1:8787
      - name: Etude deps
        working-directory: etude
        run: npm ci --no-audit --no-fund
      - name: Etude's own cloud sync property test against the worker (3 devices, 240 rounds, snapshots on)
        working-directory: etude
        env:
          ETUDE_SYNC_TEST_SERVER: http://127.0.0.1:8788
          ETUDE_SYNC_TEST_OUTBOX: /tmp/etude-outbox
          ETUDE_SYNC_SNAPSHOT_EVERY: "20"
          ETUDE_SYNC_SNAPSHOT_PART: "40"
        run: |
          nohup node ../sync-worker/test/outbox-proxy.mjs > /tmp/proxy.log 2>&1 &
          sleep 1
          node --test --test-name-pattern="real etude-cloud" test/sync.test.ts
      - name: Logs on failure
        if: failure()
        run: tail -n 200 /tmp/wrangler.log /tmp/proxy.log || true

  build-app:
    needs: resolve
    if: github.event_name != 'schedule' || needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETUDE_REF: ${{ needs.resolve.outputs.ref }}
      SYNC_URL: ${{ vars.SYNC_URL || 'https://etude.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Fetch, patch and build the Etude browser edition under /app
        run: |
          git clone https://github.com/Zibhelina/etude.git etude
          git -C etude checkout "$ETUDE_REF"
          bash scripts/patch-etude.sh etude "$SYNC_URL"
          cd etude
          npm ci --no-audit --no-fund
          VITE_APP_BASE=/app ETUDE_BROWSER_OUT="$GITHUB_WORKSPACE/sync-worker/public/app" npm run build:browser
          rm -f "$GITHUB_WORKSPACE/sync-worker/public/app/harness.html"
          echo "files: $(find "$GITHUB_WORKSPACE/sync-worker/public" -type f | wc -l)"
          big=$(find "$GITHUB_WORKSPACE/sync-worker/public" -type f -size +25M)
          if [ -n "$big" ]; then echo "files over the 25 MiB asset limit: $big"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: etude-app
          path: sync-worker/public
          retention-days: 7

  bump:
    needs: [resolve, test, build-app]
    if: github.event_name == 'schedule' && needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the new Etude release
        run: |
          echo "${{ needs.resolve.outputs.ref }}" > etude.ref
          git config user.name "github-actions[bot]"
          git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          git commit -am "Etude ${{ needs.resolve.outputs.ref }} (tests passed)"
          git push

  deploy:
    needs: [resolve, test, build-app, bump]
    # Deploy on push to main, manual runs, and after a successful scheduled bump.
    if: >-
      always() && needs.test.result == 'success' && needs.build-app.result == 'success' &&
      (needs.bump.result == 'success' || (needs.bump.result == 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when not configured
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "Deploy secrets not set; skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.go == 'true'
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.go == 'true'
        with: { name: etude-app, path: sync-worker/public }
      - name: Deploy worker + app
        if: steps.cfg.outputs.go == 'true'
        working-directory: sync-worker
        run: |
          npm install --no-audit --no-fund -D wrangler@4
          node ../scripts/render-wrangler.mjs > wrangler.deploy.jsonc
          npx wrangler d1 execute etude-sync --remote --config wrangler.deploy.jsonc --file schema.sql
          npx wrangler deploy --config wrangler.deploy.jsonc

  report-failure:
    needs: [resolve, test, build-app]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue (once per Etude release)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          title="Etude $REF does not pass the sync tests"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The daily update check found Etude $REF, but it failed the tests. The deployed version stays at ${{ needs.resolve.outputs.pinned }}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
